name: PR Code Analysis

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR Analyzer
        uses: actions/checkout@v4
        with:
          repository: isn90/pr-analyzer
          path: pr-analyzer

      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install PR Analyzer dependencies
        run: |
          cd pr-analyzer
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate GitHub Token
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "❌ ERROR: GITHUB_TOKEN is empty or not set"
            exit 1
          else
            echo "✅ GITHUB_TOKEN is set (length: ${#GITHUB_TOKEN} characters)"
            echo "✅ Token prefix: ${GITHUB_TOKEN:0:4}..."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.APP_SECRET_TOKEN }}

      - name: Run PR Analysis
        working-directory: pr-analyzer
        run: python main.py
        env:
          # Azure OpenAI Configuration
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          
          # GitHub Configuration
          GITHUB_TOKEN: ${{ secrets.APP_SECRET_TOKEN }}
          BUILD_REPOSITORY_PROVIDER: "GitHub"
          BUILD_REPOSITORY_NAME: ${{ github.repository }}
          SYSTEM_PULLREQUEST_PULLREQUESTID: ${{ github.event.pull_request.number }}
          
          # GitHub Context
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          
# Disable Azure compatibility check
spring.cloud.azure.compatibility-verifier.enabled=false

# Change Hibernate to validate (not update)
spring.jpa.hibernate.ddl-auto=validate

# Keep other settings
spring.application.name=library-management-system
server.port=8080
server.servlet.context-path=/lms
spring.cache.type=simple
logging.level.com.library=DEBUG
logging.level.org.springframework=INFO

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/lms/api-docs/swagger-config
springdoc.swagger-ui.url=/lms/api-docs
springdoc.api-docs.enabled=true
springdoc.packages-to-scan=com.cloudx.azure.library_management_system.controller
springdoc.paths-to-match=/api/**

# SQL Configuration (will be injected from App Service settings)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl